[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-data-cleaner"
version = "0.1.0"
description = "A command-line tool for cleaning CSV and Excel datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
smart-data-cleaner = "smart_data_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]